name: Sync alpha build to feed

# The AltStore/SideStore feed at /api/altstore is generated at site-build time by
# src/lib/buildParser.ts, which scans public/builds-versioned/<version>/<platform>/
# for an .ipa. Nothing published that directory, so the feed advertised the Aug
# 2026 betas indefinitely while iCube's CI published new alphas to GitHub
# Releases that never reached the site.
#
# This closes that gap. iCube's build.yml already sends a companion-release
# dispatch after publishing; the schedule is a backstop if one is missed.

on:
  repository_dispatch:
    types: [companion-release]
  workflow_dispatch:
  schedule:
    - cron: '30 */6 * * *'

concurrency:
  group: sync-alpha-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A rolling alpha, not a version series: one fixed directory that is
      # overwritten, rather than a new iOS-BetaN each run. Beta numbering stays
      # editorial and human-controlled, and the working tree holds one build
      # instead of accumulating a 90 MB IPA per alpha.
      #
      # The directory must be exactly "iOS" or "tvOS": buildParser matches
      # /^(iOS|tvOS)(?:-Beta(\d+))?$/i and silently skips anything else, so an
      # "iOS-Alpha" directory would never appear in the feed.
      - name: Sync latest alpha IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC_REPO="Provenance-Emu/iCube"
          DEST="public/builds-versioned/1.0.0/iOS"
          STAMP="$DEST/.alpha-sha"

          SHA=$(gh api "repos/${SRC_REPO}/git/ref/tags/alpha" --jq '.object.sha')
          echo "alpha tag -> $SHA"

          if [ -f "$STAMP" ] && [ "$(cat "$STAMP")" = "$SHA" ]; then
            echo "Feed already carries $SHA — nothing to do."
            exit 0
          fi

          mkdir -p "$DEST"
          gh release download alpha --repo "$SRC_REPO" \
            --pattern 'Non-Jailbroken.ipa' --output "$DEST/iCube.ipa" --clobber
          [ -s "$DEST/iCube.ipa" ] || { echo "::error::downloaded IPA is empty"; exit 1; }
          printf '%s' "$SHA" > "$STAMP"
          ls -la "$DEST"

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No change — feed is current."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/builds-versioned/1.0.0/iOS
          git commit \
            -m "chore(feed): sync latest iCube alpha build" \
            -m "Pushing to main triggers deploy.yml, which regenerates /api/altstore so the AltStore and SideStore feeds advertise this build."
          git push
