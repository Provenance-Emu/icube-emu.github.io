name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # iCube's build.yml sends this after publishing an alpha, so a new build
  # reaches the feed without waiting for a site commit.
  repository_dispatch:
    types: [companion-release]
  # Fallback for when the dispatch above never arrives: iCube's build sends it
  # with FEED_DISPATCH_TOKEN, a fine-grained PAT that (as of Sept 2026) is not
  # scoped to this repo, so it fails with HTTP 403 and the site keeps serving a
  # stale IPA. The `check` job compares the alpha asset's updated_at with the
  # stamp the last deploy published and redeploys only on change.
  #
  # Every 15 minutes, not hourly, because a stale feed is now an INSTALL FAILURE
  # rather than a cosmetic lag. The feed states the alpha's real CFBundleVersion
  # (see buildParser.ts), and iCube's build.yml stamps a new one per CI run, so
  # between an alpha being republished and this job redeploying, the feed names a
  # build number the IPA behind the rolling URL no longer carries — exactly the
  # mismatch SideStore refuses to install. This bounds that window at ~15 min
  # instead of ~60. Fixing FEED_DISPATCH_TOKEN's scope would close it properly;
  # the `check` job is two HTTP calls and deploys only on a real change, so the
  # tighter interval costs approximately nothing.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Scheduled runs only. Cheap (two HTTP calls) so it can run every hour.
  check:
    name: Alpha changed since last deploy?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Prefer the newest immutable per-build tag (alpha-<run number>). It is
          # what the feed links, it sorts numerically, and comparing tag names is
          # exact -- no timestamp parsing, no clock skew. Fall back to the rolling
          # asset's updated_at for the window before iCube has published its first
          # pinned release.
          latest=$(gh release list --repo Provenance-Emu/iCube --limit 100 \
            --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -E '^alpha-[0-9]+$' | sort -t- -k2 -n -r | head -1 || true)
          if [ -z "$latest" ]; then
            latest=$(gh api repos/Provenance-Emu/iCube/releases/tags/alpha \
              --jq '.assets[] | select(.name=="Non-Jailbroken.ipa") | .updated_at' 2>/dev/null || true)
          fi
          deployed=$(curl -fsS --max-time 20 "https://icube-emu.com/alpha-stamp.txt?nocache=$(date +%s)" || echo none)
          echo "latest=${latest:-<api failed>}  deployed=${deployed}"
          # An API failure must not trigger a redeploy — nothing to deploy from.
          if [ -z "$latest" ] || [ "$latest" = "$deployed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    # `check` is skipped on every non-schedule event, and a skipped dependency
    # would skip us too without !cancelled(). On schedule, build only on change.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: sitemap.ts derives <lastmod> from `git log -1 -- <file>`;
          # a shallow clone stamps every route with the checkout commit's date.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Install dependencies
        run: npm ci
      
      # The feed is generated at build time: prebuild
      # (scripts/generate-versioned-ipas.js) reads public/builds/ and emits
      # public/builds-versioned/, which buildParser scans for /api/altstore.
      #
      # public/builds/ only holds the hand-added beta IPAs, so the feed advertised
      # the Aug 2026 betas indefinitely while iCube CI published newer alphas to
      # GitHub Releases that never reached the site. Fetch the current alpha into
      # the working tree instead of committing it: builds-versioned/ is already
      # gitignored as generated output, and committing a 90 MB IPA per build would
      # grow a 244 MB repo with no LFS for artifacts that are reproducible.
      #
      # Directory must be exactly "iOS": buildParser matches
      # /^(iOS|tvOS)(?:-Beta(\d+))?$/i and silently skips anything else.
      # iOS only for now — the alpha release carries no tvOS artifact.
      - name: Fetch latest iCube alpha build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEST="public/builds/1.0.0/iOS"
          mkdir -p "$DEST"

          # Prefer an immutable per-build release over the rolling `alpha` tag.
          #
          # The feed is a static snapshot: it states the IPA's real version
          # strings, and AltStore/SideStore verify the download against them. If
          # the URL it links is the rolling one, every new alpha silently
          # invalidates the deployed feed until this workflow runs again, and
          # installs fail in the meantime. Linking a tag whose bytes can never be
          # replaced makes a stale feed merely OLD rather than broken.
          #
          # Numeric sort on the run-number suffix, so alpha-99 does not beat
          # alpha-104 the way a lexical sort would.
          PIN=$(gh release list --repo Provenance-Emu/iCube --limit 100 \
            --json tagName --jq '.[].tagName' 2>/dev/null \
            | grep -E '^alpha-[0-9]+$' | sort -t- -k2 -n -r | head -1 || true)

          if [ -n "$PIN" ]; then
            SRC_TAG="$PIN"
          else
            # Only before iCube's first pinned release exists. Same behaviour as
            # before: correct at deploy time, drifts until the next deploy.
            echo "::warning::no immutable alpha-<n> release found — falling back to the rolling alpha tag"
            SRC_TAG="alpha"
          fi

          if gh release download "$SRC_TAG" --repo Provenance-Emu/iCube \
               --pattern 'Non-Jailbroken.ipa' --output "$DEST/iCube.ipa" --clobber; then
            [ -s "$DEST/iCube.ipa" ] || { echo "::warning::alpha IPA was empty — feed keeps the committed betas"; rm -f "$DEST/iCube.ipa"; exit 0; }
            echo "Fetched $SRC_TAG -> $DEST/iCube.ipa ($(stat -c%s "$DEST/iCube.ipa" 2>/dev/null || stat -f%z "$DEST/iCube.ipa") bytes)"

            # Tell the feed generator which URL these bytes came from, so it
            # links the artifact it actually read rather than a hardcoded
            # constant. Written next to the IPA; buildParser falls back to the
            # rolling URL when it is absent (local dev, or the fallback above).
            printf '{"tag":"%s","downloadURL":"https://github.com/Provenance-Emu/iCube/releases/download/%s/Non-Jailbroken.ipa"}\n' \
              "$SRC_TAG" "$SRC_TAG" > "$DEST/alpha-source.json"

            # Published as /alpha-stamp.txt so the `check` job can tell whether
            # the deployed feed already points at the current build.
            if [ "$SRC_TAG" = "alpha" ]; then
              STAMP=$(gh api repos/Provenance-Emu/iCube/releases/tags/alpha \
                --jq '.assets[] | select(.name=="Non-Jailbroken.ipa") | .updated_at' 2>/dev/null || true)
            else
              STAMP="$SRC_TAG"
            fi
            echo "ALPHA_STAMP=${STAMP:-unknown}" >> "$GITHUB_ENV"
          else
            echo "::warning::could not download $SRC_TAG — feed keeps the committed betas"
          fi

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://icube-emu.com

      - name: Write build SHA and alpha stamp
        run: |
          echo "${{ github.sha }}" > ./out/build-sha.txt
          echo "${ALPHA_STAMP:-unknown}" > ./out/alpha-stamp.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Same trap as `build`: the skipped `check` job is in this job's transitive
    # needs chain, so the implicit success() is false on every push event and
    # the site never deployed. Gate on build's own result instead.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4