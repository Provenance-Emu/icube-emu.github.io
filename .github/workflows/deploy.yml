name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # iCube's build.yml sends this after publishing an alpha, so a new build
  # reaches the feed without waiting for a site commit.
  repository_dispatch:
    types: [companion-release]
  # Fallback for when the dispatch above never arrives: iCube's build sends it
  # with FEED_DISPATCH_TOKEN, a fine-grained PAT that (as of Sept 2026) is not
  # scoped to this repo, so it fails with HTTP 403 and the site keeps serving a
  # stale IPA. The hourly `check` job compares the alpha asset's updated_at
  # with the stamp the last deploy published and redeploys only on change.
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Scheduled runs only. Cheap (two HTTP calls) so it can run every hour.
  check:
    name: Alpha changed since last deploy?
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
    steps:
      - id: cmp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          latest=$(gh api repos/Provenance-Emu/iCube/releases/tags/alpha \
            --jq '.assets[] | select(.name=="Non-Jailbroken.ipa") | .updated_at' 2>/dev/null || true)
          deployed=$(curl -fsS --max-time 20 "https://icube-emu.com/alpha-stamp.txt?nocache=$(date +%s)" || echo none)
          echo "latest=${latest:-<api failed>}  deployed=${deployed}"
          # An API failure must not trigger a redeploy — nothing to deploy from.
          if [ -z "$latest" ] || [ "$latest" = "$deployed" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    # `check` is skipped on every non-schedule event, and a skipped dependency
    # would skip us too without !cancelled(). On schedule, build only on change.
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.check.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Install dependencies
        run: npm ci
      
      # The feed is generated at build time: prebuild
      # (scripts/generate-versioned-ipas.js) reads public/builds/ and emits
      # public/builds-versioned/, which buildParser scans for /api/altstore.
      #
      # public/builds/ only holds the hand-added beta IPAs, so the feed advertised
      # the Aug 2026 betas indefinitely while iCube CI published newer alphas to
      # GitHub Releases that never reached the site. Fetch the current alpha into
      # the working tree instead of committing it: builds-versioned/ is already
      # gitignored as generated output, and committing a 90 MB IPA per build would
      # grow a 244 MB repo with no LFS for artifacts that are reproducible.
      #
      # Directory must be exactly "iOS": buildParser matches
      # /^(iOS|tvOS)(?:-Beta(\d+))?$/i and silently skips anything else.
      # iOS only for now — the alpha release carries no tvOS artifact.
      - name: Fetch latest iCube alpha build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEST="public/builds/1.0.0/iOS"
          mkdir -p "$DEST"
          if gh release download alpha --repo Provenance-Emu/iCube \
               --pattern 'Non-Jailbroken.ipa' --output "$DEST/iCube.ipa" --clobber; then
            [ -s "$DEST/iCube.ipa" ] || { echo "::warning::alpha IPA was empty — feed keeps the committed betas"; rm -f "$DEST/iCube.ipa"; exit 0; }
            echo "Fetched alpha -> $DEST/iCube.ipa ($(stat -c%s "$DEST/iCube.ipa" 2>/dev/null || stat -f%z "$DEST/iCube.ipa") bytes)"
            # Published as /alpha-stamp.txt so the hourly `check` job can tell
            # whether the deployed IPA is already the current one.
            STAMP=$(gh api repos/Provenance-Emu/iCube/releases/tags/alpha \
              --jq '.assets[] | select(.name=="Non-Jailbroken.ipa") | .updated_at' 2>/dev/null || true)
            echo "ALPHA_STAMP=${STAMP:-unknown}" >> "$GITHUB_ENV"
          else
            echo "::warning::could not download the alpha release — feed keeps the committed betas"
          fi

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: https://icube-emu.com

      - name: Write build SHA and alpha stamp
        run: |
          echo "${{ github.sha }}" > ./out/build-sha.txt
          echo "${ALPHA_STAMP:-unknown}" > ./out/alpha-stamp.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4